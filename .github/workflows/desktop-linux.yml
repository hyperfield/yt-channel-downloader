name: Linux desktop packages

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: desktop-linux-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build AppImage, DEB, and RPM (x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Validate release metadata and architecture
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/desktop_release.py --tag "$RELEASE_TAG" --expect-arch x86_64
      - name: Install packaging tools and Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes file rpm desktop-file-utils squashfs-tools xvfb \
            libegl1 libgl1 libopengl0 libx11-6 libx11-xcb1 libxcb1 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libfreetype6 \
            libdbus-1-3 libglib2.0-0 libnss3 libnspr4 libice6 libsm6 \
            libharfbuzz0b libpango-1.0-0 libpangocairo-1.0-0 libwayland-cursor0 libwayland-egl1
      - name: Install build environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . cx-Freeze==8.7.4
          python -m pip check
      - name: Freeze and check the application
        run: |
          python scripts/build_unix_cxfreeze.py build_exe
          python scripts/smoke_unix_bundle.py build/linux/cxfreeze/x86_64/app/yt-channel-downloader
      - name: Build packages and check AppImage contents
        run: |
          python scripts/package_linux.py
          python scripts/smoke_unix_bundle.py --appimage dist/linux/*.AppImage
          cd dist/linux
          sha256sum --check SHA256SUMS-linux-x86_64.txt
      - name: Save packages
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-packages
          path: dist/linux/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  test-deb:
    name: Install and remove DEB on ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12']
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: linux-x86_64-packages
          path: packages
      - name: Verify, install, launch, and remove
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          cd packages
          sha256sum --check SHA256SUMS-linux-x86_64.txt
          apt-get update
          apt-get install --yes python3 xvfb ./*.deb
          python3 ../scripts/smoke_unix_bundle.py /usr/bin/yt-channel-downloader
          test -f /usr/share/applications/yt-channel-downloader.desktop
          apt-get remove --yes yt-channel-downloader
          test ! -e /usr/bin/yt-channel-downloader
          test ! -e /usr/lib/yt-channel-downloader
          test ! -e /usr/share/applications/yt-channel-downloader.desktop

  test-rpm:
    name: Install and remove RPM on Fedora 44
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: linux-x86_64-packages
          path: packages
      - name: Verify, install, launch, and remove
        run: |
          cd packages
          sha256sum --check SHA256SUMS-linux-x86_64.txt
          dnf install --assumeyes python3 xorg-x11-server-Xvfb ./*.rpm
          python3 ../scripts/smoke_unix_bundle.py /usr/bin/yt-channel-downloader
          test -f /usr/share/applications/yt-channel-downloader.desktop
          dnf remove --assumeyes yt-channel-downloader
          test ! -e /usr/bin/yt-channel-downloader
          test ! -e /usr/lib/yt-channel-downloader
          test ! -e /usr/share/applications/yt-channel-downloader.desktop

  publish:
    name: Attach validated Linux packages to release
    if: github.event_name == 'release'
    needs: [build, test-deb, test-rpm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-x86_64-packages
          path: packages
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cd packages
          sha256sum --check SHA256SUMS-linux-x86_64.txt
          gh release upload "$RELEASE_TAG" ./* --clobber
